<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Boat Spring-Line Simulator</title>

<style>
html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b1d2a;
  font-family:Arial, sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  background:#7ec8e3;
}

.hud{
  position:fixed;
  top:14px;
  left:14px;
  padding:10px 14px;
  border-radius:8px;
  background:rgba(0,0,0,.45);
  color:white;
  font-size:14px;
  line-height:1.45;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="hud">
↑ / ↓ throttle<br>
← / → rudder<br>
Boat stays port side of dock
</div>

<script>
const ctx = c.getContext("2d");

function resize(){
  c.width = window.innerWidth;
  c.height = window.innerHeight;

  // keep boat centered after resize
  boat.y = c.height / 2;
}
window.addEventListener("resize", resize);

// ==================================================
// SETTINGS
// ==================================================
const dockWidth = 28;
const dockX = 260;

const boatLength = 92;
const boatBeam   = 28;

const lineLength = 220;
const lineStiffness = 0.028;

// >>> CHANGE MAX SPEED HERE <<<
const MAX_SPEED = 1;

// slower acceleration
const THRUST_POWER = 0.03;

// ==================================================

const boat = {
  x: 520,
  y: window.innerHeight / 2,
  angle: Math.PI,
  vx:0,
  vy:0,
  av:0
};

let throttle = 0.18;
let rudder = 0;

// stern spring line attachment point
const attachLocal = {x:-28, y:11};

function rotate(x,y,a){
  return {
    x:x*Math.cos(a)-y*Math.sin(a),
    y:x*Math.sin(a)+y*Math.cos(a)
  };
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function update(){

  // ------------------------------------
  // Engine thrust (slower)
  // ------------------------------------
  const thrust = throttle * THRUST_POWER;

  boat.vx += Math.cos(boat.angle) * thrust;
  boat.vy += Math.sin(boat.angle) * thrust;

  // ------------------------------------
  // Speed limiter
  // ------------------------------------
  const speed = Math.hypot(boat.vx, boat.vy);

  if(speed > MAX_SPEED){
    const scale = MAX_SPEED / speed;
    boat.vx *= scale;
    boat.vy *= scale;
  }

  // rudder
  boat.av += rudder * speed * 0.002;

  // ------------------------------------
  // Spring line force
  // ------------------------------------
  const rp = rotate(attachLocal.x, attachLocal.y, boat.angle);

  const ax = boat.x + rp.x;
  const ay = boat.y + rp.y;

  const cleatY = c.height / 2;

  let dx = dockX - ax;
  let dy = cleatY - ay;

  const dist = Math.hypot(dx,dy);

  if(dist > lineLength){
    const stretch = dist - lineLength;

    const fx = dx/dist * stretch * lineStiffness;
    const fy = dy/dist * stretch * lineStiffness;

    boat.vx += fx;
    boat.vy += fy;

    const torque = rp.x * fy - rp.y * fx;
    boat.av += torque * 0.00065;
  }

  // damping
  boat.vx *= 0.992;
  boat.vy *= 0.992;
  boat.av *= 0.96;

  // move
  boat.x += boat.vx;
  boat.y += boat.vy;
  boat.angle += boat.av;

  // keep left of dock
  const maxX = dockX - 20;

  if(boat.x > maxX){
    boat.x = maxX;
    if(boat.vx > 0) boat.vx = 0;
  }

  boat.av = clamp(boat.av,-0.045,0.045);
}

function drawBoat(){

  ctx.save();
  ctx.translate(boat.x, boat.y);
  ctx.rotate(boat.angle);

  ctx.fillStyle="#1f4f8a";
  ctx.strokeStyle="#0e2742";
  ctx.lineWidth=2;

  // pointed bow
  ctx.beginPath();
  ctx.moveTo( boatLength/2, 0);
  ctx.lineTo( boatLength/4, -boatBeam/2);
  ctx.lineTo(-boatLength/2,-boatBeam/2);
  ctx.lineTo(-boatLength/2, boatBeam/2);
  ctx.lineTo( boatLength/4, boatBeam/2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-24,0);
  ctx.lineTo(34,0);
  ctx.stroke();

  ctx.restore();
}

function draw(){

  ctx.clearRect(0,0,c.width,c.height);

  // water lines
  ctx.strokeStyle="rgba(255,255,255,.08)";
  for(let y=0;y<c.height;y+=50){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(c.width,y);
    ctx.stroke();
  }

  // dock centered vertically
  ctx.fillStyle="#666";
  ctx.fillRect(dockX,0,dockWidth,c.height);

  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.fillRect(dockX-8,0,8,c.height);

  const cleatY = c.height/2;

  // line
  const rp = rotate(attachLocal.x, attachLocal.y, boat.angle);
  const ax = boat.x + rp.x;
  const ay = boat.y + rp.y;

  ctx.strokeStyle="#f5f1c2";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(dockX, cleatY);
  ctx.lineTo(ax, ay);
  ctx.stroke();

  // cleat
  ctx.fillStyle="#222";
  ctx.beginPath();
  ctx.arc(dockX, cleatY, 5, 0, Math.PI*2);
  ctx.fill();

  drawBoat();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// controls
window.addEventListener("keydown", e=>{
  if(e.key==="ArrowUp") throttle = clamp(throttle + 0.04, -0.4, 0.7);
  if(e.key==="ArrowDown") throttle = clamp(throttle - 0.04, -0.4, 0.7);
  if(e.key==="ArrowLeft") rudder = -1;
  if(e.key==="ArrowRight") rudder = 1;
});

window.addEventListener("keyup", e=>{
  if(e.key==="ArrowLeft" || e.key==="ArrowRight") rudder = 0;
});

resize();
loop();
</script>

</body>
</html>
