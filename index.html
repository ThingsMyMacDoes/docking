<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spring Line Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a3a4a}
canvas{display:block}
#hud{
  position:fixed;top:16px;left:16px;
  color:#fff;background:rgba(0,0,0,.5);
  padding:10px 14px;border-radius:8px;
  font:14px/1.6 Arial,sans-serif;
  pointer-events:none;
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  ← port rudder &nbsp;|&nbsp; → starboard rudder<br>
  <span style="opacity:.65;font-size:12px">Keep the boat parallel to the dock</span>
</div>
<script>
"use strict";

// ── canvas setup ──────────────────────────────────────────────────────
const cv  = document.getElementById("cv");
const ctx = cv.getContext("2d");

function resize() { cv.width = innerWidth; cv.height = innerHeight; }
window.addEventListener("resize", resize);
resize();

// ── world layout ──────────────────────────────────────────────────────
// dock is a vertical wall on the right
const DOCK_X = Math.round(cv.width * 0.72);

// ── boat geometry ─────────────────────────────────────────────────────
const BOAT_L = 90;   // length
const BOAT_B = 22;   // beam

// spring line length (pixels)
const LINE = 200;

// cleat position in boat-local coords
// local frame: +x = starboard, +y = toward stern
// (at angle -PI/2, starboard is world-right, stern is world-down)
const CL_X =  10;   // starboard
const CL_Y =  30;   // aft

// ── derive start position so line is taut and horizontal ─────────────
// angle = -PI/2  =>  cos = 0, sin = -1
// rp.x = CL_X*cos - CL_Y*sin = 0 - 30*(-1) =  30
// rp.y = CL_X*sin + CL_Y*cos = 10*(-1) + 0  = -10
// dock cleat world pos: (DOCK_X,  cv.height/2)
// want attachWorld.y = cv.height/2:
//   boat.y + rp.y = cv.height/2  =>  boat.y = cv.height/2 - (-10) = cv.height/2 + 10
// want dist = LINE:
//   attachWorld.x = DOCK_X - LINE
//   boat.x + rp.x = DOCK_X - LINE  =>  boat.x = DOCK_X - LINE - 30

const START_ANGLE = -Math.PI / 2;

const b = {                          // boat state
  x    : DOCK_X - LINE - 30,
  y    : cv.height / 2 + 10,
  angle: START_ANGLE,
  av   : 0,                          // angular velocity
};

const SPEED       = 0.55;            // constant forward speed (px/frame)
const RUDDER      = 0.0022;          // rudder angular acceleration per frame
const ANG_DRAG    = 0.94;            // angular drag

let rudder = 0;                      // -1 port, 0 neutral, +1 starboard

// ── helpers ───────────────────────────────────────────────────────────
function rot(lx, ly, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: lx*c - ly*s,  y: lx*s + ly*c };
}

// world position of boat cleat
function cleatWorld() {
  const r = rot(CL_X, CL_Y, b.angle);
  return { x: b.x + r.x,  y: b.y + r.y,  rx: r.x,  ry: r.y };
}

// ── physics update ────────────────────────────────────────────────────
function update() {

  // 1. move forward at constant speed
  b.x += Math.cos(b.angle) * SPEED;
  b.y += Math.sin(b.angle) * SPEED;

  // 2. rudder
  b.av += rudder * SPEED * RUDDER;

  // 3. angular drag & clamp
  b.av *= ANG_DRAG;
  b.av  = Math.max(-0.04, Math.min(0.04, b.av));

  // 4. rotate
  b.angle += b.av;

  // 5. line constraint — hard stop, no spring
  const dockCleatY = cv.height / 2;
  const cl = cleatWorld();

  const ex   = cl.x - DOCK_X;          // vector: dock→boatCleat
  const ey   = cl.y - dockCleatY;
  const dist = Math.hypot(ex, ey);

  if (dist > LINE) {
    // unit vector pointing away from dock along the line
    const nx = ex / dist;
    const ny = ey / dist;

    // translate boat back so cleat is exactly LINE from dock
    const over = dist - LINE;
    b.x -= nx * over;
    b.y -= ny * over;

    // angular impulse: line force (inward = -nx,-ny) applied at cleat arm (cl.rx, cl.ry)
    // torque = arm × force  (2-D cross: arm.x*F.y - arm.y*F.x)
    // scale by a small factor to feel natural
    const torque = cl.rx * (-ny) - cl.ry * (-nx);
    b.av += torque * 0.001;
    b.av  = Math.max(-0.04, Math.min(0.04, b.av));
  }
}

// ── rendering ─────────────────────────────────────────────────────────
function drawWater() {
  ctx.fillStyle = "#5bacc9";
  ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = "rgba(255,255,255,.07)";
  ctx.lineWidth = 1;
  for (let y = 0; y < cv.height; y += 55) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke();
  }
}

function drawDock() {
  // dock face shadow
  ctx.fillStyle = "rgba(255,255,255,.1)";
  ctx.fillRect(DOCK_X - 7, 0, 7, cv.height);

  // dock body
  ctx.fillStyle = "#8b7355";
  ctx.fillRect(DOCK_X, 0, cv.width - DOCK_X, cv.height);

  // planks
  ctx.strokeStyle = "rgba(0,0,0,.18)";
  ctx.lineWidth = 1;
  for (let y = 0; y < cv.height; y += 36) {
    ctx.beginPath(); ctx.moveTo(DOCK_X, y); ctx.lineTo(cv.width, y); ctx.stroke();
  }
  // dock edge
  ctx.strokeStyle = "#5a4a35";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(DOCK_X, 0); ctx.lineTo(DOCK_X, cv.height); ctx.stroke();
}

function drawLine() {
  const dockCleatY = cv.height / 2;
  const cl = cleatWorld();

  const dist = Math.hypot(cl.x - DOCK_X, cl.y - dockCleatY);
  const taut = dist >= LINE - 1;

  // line
  ctx.strokeStyle = taut ? "#f5e97a" : "rgba(245,233,122,.3)";
  ctx.lineWidth   = taut ? 2.5 : 1.5;
  ctx.setLineDash(taut ? [] : [7, 5]);
  ctx.beginPath();
  ctx.moveTo(DOCK_X, dockCleatY);
  ctx.lineTo(cl.x, cl.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // dock cleat
  ctx.fillStyle   = "#444";
  ctx.strokeStyle = "#222";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(DOCK_X, dockCleatY, 5, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
}

function drawBoat() {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);

  const hl = BOAT_L / 2;
  const hb = BOAT_B / 2;

  // hull shadow
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.moveTo( 2, -hl + 2);
  ctx.lineTo( hb + 2, -hl * 0.38 + 2);
  ctx.lineTo( hb + 2,  hl + 2);
  ctx.lineTo(-hb + 2,  hl + 2);
  ctx.lineTo(-hb + 2, -hl * 0.38 + 2);
  ctx.closePath();
  ctx.fill();

  // hull
  ctx.fillStyle   = "#2255a0";
  ctx.strokeStyle = "#0d2d60";
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo( 0,  -hl);           // bow
  ctx.lineTo( hb, -hl * 0.38);
  ctx.lineTo( hb,  hl);           // stern starboard
  ctx.lineTo(-hb,  hl);           // stern port
  ctx.lineTo(-hb, -hl * 0.38);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // deck stripe
  ctx.fillStyle = "#1a3f7a";
  ctx.beginPath();
  ctx.moveTo( 0,  -hl + 6);
  ctx.lineTo( hb - 3, -hl * 0.38 + 3);
  ctx.lineTo( hb - 3,  hl - 3);
  ctx.lineTo(-hb + 3,  hl - 3);
  ctx.lineTo(-hb + 3, -hl * 0.38 + 3);
  ctx.closePath();
  ctx.fill();

  // centerline
  ctx.strokeStyle = "rgba(255,255,255,.2)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -hl + 8);
  ctx.lineTo(0,  hl - 6);
  ctx.stroke();

  // bow indicator (white triangle)
  ctx.fillStyle = "rgba(255,255,255,.7)";
  ctx.beginPath();
  ctx.moveTo( 0, -hl + 4);
  ctx.lineTo( 4, -hl + 12);
  ctx.lineTo(-4, -hl + 12);
  ctx.closePath();
  ctx.fill();

  // cleat (yellow dot)
  ctx.fillStyle   = "#ffd54f";
  ctx.strokeStyle = "#c8a000";
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.arc(CL_X, CL_Y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function draw() {
  drawWater();
  drawDock();
  drawLine();
  drawBoat();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ── input ─────────────────────────────────────────────────────────────
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft")  { rudder = -1; e.preventDefault(); }
  if (e.key === "ArrowRight") { rudder =  1; e.preventDefault(); }
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") rudder = 0;
});

loop();
</script>
</body>
</html>
