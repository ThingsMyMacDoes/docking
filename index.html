
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Boat Spring-Line Simulator</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b1d2a;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
  background:#7ec8e3;
}
.hud{
  position:fixed;
  top:14px;
  left:14px;
  color:#fff;
  background:rgba(0,0,0,.45);
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  line-height:1.45;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
↑ / ↓ throttle<br>
← / → rudder<br>
Start: line fully taut at 90° to dock<br>
No rudder = bow turns toward dock
</div>

<script>
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight;
}
addEventListener("resize", resize);

// =====================================
const dockX = innerWidth * 0.48;
const dockWidth = 28;

const boatLength = 92;
const boatBeam   = 28;

const lineLength = 220;
const lineStiffness = 0.035;

// CHANGE MAX SPEED HERE
const MAX_SPEED = 1.35;

const THRUST_POWER = 0.032;
const RUDDER_POWER = 0.0026;
// =====================================

/*
Boat points LEFT initially.

Starboard aft quarter = lower side on screen.
*/
const attachLocal = {
  x:-28,
  y:11
};

const startAngle = Math.PI;
const startY = innerHeight / 2;

/*
Need attachment point exactly lineLength from dock.
At angle PI:
rotated attach point = (+28 , -11)

So:
attachmentX = boat.x + 28
attachmentY = boat.y - 11

Set attachmentY = cleatY
=> boat.y = cleatY + 11

Set horizontal distance = lineLength
=> attachmentX = dockX + lineLength
=> boat.x = dockX + lineLength - 28
*/
const cleatY = startY;

const boat = {
  x: dockX + lineLength - 28,
  y: cleatY + 11,
  angle: startAngle,
  vx:0,
  vy:0,
  av:0
};

let throttle = 0.18;
let rudder = 0;

function rotate(x,y,a){
  return {
    x:x*Math.cos(a)-y*Math.sin(a),
    y:x*Math.sin(a)+y*Math.cos(a)
  };
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function update(){

  const thrust = throttle * THRUST_POWER;

  boat.vx += Math.cos(boat.angle) * thrust;
  boat.vy += Math.sin(boat.angle) * thrust;

  let speed = Math.hypot(boat.vx, boat.vy);

  if(speed > MAX_SPEED){
    const s = MAX_SPEED / speed;
    boat.vx *= s;
    boat.vy *= s;
    speed = MAX_SPEED;
  }

  // rudder
  boat.av += rudder * speed * RUDDER_POWER;

  const rp = rotate(attachLocal.x, attachLocal.y, boat.angle);

  const ax = boat.x + rp.x;
  const ay = boat.y + rp.y;

  const cy = c.height/2;

  const dx = dockX - ax;
  const dy = cy - ay;

  const dist = Math.hypot(dx,dy);

  if(dist >= lineLength){

    const stretch = dist - lineLength;

    const fx = dx/dist * (stretch + 0.25) * lineStiffness;
    const fy = dy/dist * (stretch + 0.25) * lineStiffness;

    boat.vx += fx;
    boat.vy += fy;

    /*
    Positive torque = clockwise on screen
    which turns bow DOWN toward dock.
    */
    let torque = -(rp.x * fy - rp.y * fx);

    // ensure line only turns toward dock
    if(torque < 0) torque = 0;

    boat.av += torque * 0.003;
  }

  boat.vx *= 0.992;
  boat.vy *= 0.992;
  boat.av *= 0.958;

  boat.x += boat.vx;
  boat.y += boat.vy;
  boat.angle += boat.av;

  // keep boat left of dock
  const maxX = dockX - 18;
  if(boat.x > maxX){
    boat.x = maxX;
    if(boat.vx > 0) boat.vx = 0;
  }

  boat.av = clamp(boat.av,-0.05,0.05);
}

function drawBoat(){

  ctx.save();
  ctx.translate(boat.x,boat.y);
  ctx.rotate(boat.angle);

  ctx.fillStyle="#1f4f8a";
  ctx.strokeStyle="#102842";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo( boatLength/2,0);
  ctx.lineTo( boatLength/4,-boatBeam/2);
  ctx.lineTo(-boatLength/2,-boatBeam/2);
  ctx.lineTo(-boatLength/2, boatBeam/2);
  ctx.lineTo( boatLength/4, boatBeam/2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-24,0);
  ctx.lineTo(34,0);
  ctx.stroke();

  ctx.fillStyle="#ffd54a";
  ctx.beginPath();
  ctx.arc(attachLocal.x, attachLocal.y, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function draw(){

  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle="rgba(255,255,255,.08)";
  for(let y=0;y<c.height;y+=50){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(c.width,y);
    ctx.stroke();
  }

  ctx.fillStyle="#666";
  ctx.fillRect(dockX,0,dockWidth,c.height);

  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.fillRect(dockX-8,0,8,c.height);

  const cy = c.height/2;

  const rp = rotate(attachLocal.x, attachLocal.y, boat.angle);
  const ax = boat.x + rp.x;
  const ay = boat.y + rp.y;

  ctx.strokeStyle="#f5f1c2";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(dockX,cy);
  ctx.lineTo(ax,ay);
  ctx.stroke();

  ctx.fillStyle="#222";
  ctx.beginPath();
  ctx.arc(dockX,cy,5,0,Math.PI*2);
  ctx.fill();

  drawBoat();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

addEventListener("keydown",e=>{
  if(e.key==="ArrowUp") throttle = clamp(throttle+0.04,-0.4,0.7);
  if(e.key==="ArrowDown") throttle = clamp(throttle-0.04,-0.4,0.7);
  if(e.key==="ArrowLeft") rudder = -1;
  if(e.key==="ArrowRight") rudder = 1;
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft" || e.key==="ArrowRight") rudder = 0;
});

resize();
loop();
</script>

</body>
</html>
