
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Boat Spring-Line Simulator</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b1d2a;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
  background:#7ec8e3;
}
.hud{
  position:fixed;
  top:14px;
  left:14px;
  color:#fff;
  background:rgba(0,0,0,.45);
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  line-height:1.45;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
↑ / ↓ throttle<br>
← / → rudder<br>
Spring line fixed starboard aft quarter<br>
Use rudder to stop bow swinging into dock
</div>

<script>
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight;
}
addEventListener("resize", resize);

// ==========================================
// SETTINGS
// ==========================================
const dockX = 260;
const dockWidth = 28;

const boatLength = 92;
const boatBeam   = 28;

// line settings
const lineLength = 220;
const lineStiffness = 0.032;

// >>> MAX SPEED HERE <<<
const MAX_SPEED = 1.35;

// slower engine
const THRUST_POWER = 0.032;

// rudder strength
const RUDDER_POWER = 0.0026;

// ==========================================

const boat = {
  x:520,
  y:innerHeight/2,
  angle:Math.PI,
  vx:0,
  vy:0,
  av:0
};

let throttle = 0.18;
let rudder = 0;

/*
IMPORTANT:
Positive Y in canvas = downward.
Boat facing left initially.

Starboard side = upper side of hull on screen
when facing left, so negative local y.

Attachment point:
aft quarter + starboard side
This creates correct tendency:
line tension rotates bow toward dock.
*/
const attachLocal = {
  x:-28,   // aft
  y:-11    // starboard side
};

function rotate(x,y,a){
  return {
    x:x*Math.cos(a)-y*Math.sin(a),
    y:x*Math.sin(a)+y*Math.cos(a)
  };
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function update(){

  // engine thrust
  const thrust = throttle * THRUST_POWER;

  boat.vx += Math.cos(boat.angle) * thrust;
  boat.vy += Math.sin(boat.angle) * thrust;

  // speed limit
  let speed = Math.hypot(boat.vx, boat.vy);
  if(speed > MAX_SPEED){
    const s = MAX_SPEED / speed;
    boat.vx *= s;
    boat.vy *= s;
    speed = MAX_SPEED;
  }

  // rudder effect
  boat.av += rudder * speed * RUDDER_POWER;

  // line attachment world point
  const rp = rotate(attachLocal.x, attachLocal.y, boat.angle);
  const ax = boat.x + rp.x;
  const ay = boat.y + rp.y;

  const cleatY = c.height/2;

  const dx = dockX - ax;
  const dy = cleatY - ay;

  const dist = Math.hypot(dx,dy);

  if(dist > lineLength){

    const stretch = dist - lineLength;

    const fx = dx/dist * stretch * lineStiffness;
    const fy = dy/dist * stretch * lineStiffness;

    // pull boat
    boat.vx += fx;
    boat.vy += fy;

    /*
      Torque = r x F

      With attachment on starboard quarter,
      tension now naturally yaws bow INTO dock.
    */
    const torque = rp.x * fy - rp.y * fx;

    boat.av += torque * 0.00072;
  }

  // damping
  boat.vx *= 0.992;
  boat.vy *= 0.992;
  boat.av *= 0.958;

  // move
  boat.x += boat.vx;
  boat.y += boat.vy;
  boat.angle += boat.av;

  // keep boat left of dock
  const maxX = dockX - 18;
  if(boat.x > maxX){
    boat.x = maxX;
    if(boat.vx > 0) boat.vx = 0;
  }

  // prevent insane spin
  boat.av = clamp(boat.av,-0.05,0.05);
}

function drawBoat(){

  ctx.save();
  ctx.translate(boat.x,boat.y);
  ctx.rotate(boat.angle);

  ctx.fillStyle="#1f4f8a";
  ctx.strokeStyle="#102842";
  ctx.lineWidth=2;

  // hull
  ctx.beginPath();
  ctx.moveTo( boatLength/2,0);
  ctx.lineTo( boatLength/4,-boatBeam/2);
  ctx.lineTo(-boatLength/2,-boatBeam/2);
  ctx.lineTo(-boatLength/2, boatBeam/2);
  ctx.lineTo( boatLength/4, boatBeam/2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // centerline
  ctx.beginPath();
  ctx.moveTo(-24,0);
  ctx.lineTo(34,0);
  ctx.stroke();

  // mark spring cleat
  ctx.fillStyle="#ffd54a";
  ctx.beginPath();
  ctx.arc(attachLocal.x, attachLocal.y, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function draw(){

  ctx.clearRect(0,0,c.width,c.height);

  // water grid
  ctx.strokeStyle="rgba(255,255,255,.08)";
  for(let y=0;y<c.height;y+=50){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(c.width,y);
    ctx.stroke();
  }

  // dock
  ctx.fillStyle="#666";
  ctx.fillRect(dockX,0,dockWidth,c.height);

  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.fillRect(dockX-8,0,8,c.height);

  const cleatY = c.height/2;

  // spring line
  const rp = rotate(attachLocal.x, attachLocal.y, boat.angle);
  const ax = boat.x + rp.x;
  const ay = boat.y + rp.y;

  ctx.strokeStyle="#f5f1c2";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(dockX,cleatY);
  ctx.lineTo(ax,ay);
  ctx.stroke();

  // dock cleat
  ctx.fillStyle="#222";
  ctx.beginPath();
  ctx.arc(dockX,cleatY,5,0,Math.PI*2);
  ctx.fill();

  drawBoat();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// controls
addEventListener("keydown",e=>{
  if(e.key==="ArrowUp") throttle = clamp(throttle+0.04,-0.4,0.7);
  if(e.key==="ArrowDown") throttle = clamp(throttle-0.04,-0.4,0.7);
  if(e.key==="ArrowLeft") rudder = -1;
  if(e.key==="ArrowRight") rudder = 1;
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft" || e.key==="ArrowRight") rudder = 0;
});

resize();
loop();
</script>

</body>
</html>
